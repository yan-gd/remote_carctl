spring.application.name=patrol-management
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
patrol.database.path=${PATROL_DB_PATH:}
patrol.jwt.secret=${PATROL_JWT_SECRET:}
patrol.jwt.ttl-seconds=3600
patrol.demo.enabled=${PATROL_DEMO_ENABLED:false}
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.throw-exception-if-no-handler-found=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.resources.add-mappings=false

# Robot link (exp3). Topics: robot/{id}/control|status|heartbeat|control/ack, see exp3/docs/MQTT-PROTOCOL.md
patrol.robot.id=${PATROL_ROBOT_ID:SCOUT-001}
patrol.robot.name=SCOUT MINI Pro Kit
patrol.robot.model=SCOUT MINI
patrol.robot.heartbeat-timeout-ms=${PATROL_HEARTBEAT_TIMEOUT_MS:3000}
patrol.robot.check-interval-ms=500
patrol.robot.keepalive-window-ms=1500
patrol.robot.low-battery-pct=20
patrol.robot.low-battery-voltage=${PATROL_LOW_BATTERY_VOLTAGE:}
patrol.mqtt.enabled=${PATROL_MQTT_ENABLED:true}
patrol.mqtt.broker-url=${PATROL_MQTT_URL:tcp://127.0.0.1:1883}
patrol.mqtt.client-id=${PATROL_MQTT_CLIENT_ID:}
patrol.mqtt.username=${PATROL_MQTT_USERNAME:}
patrol.mqtt.password=${PATROL_MQTT_PASSWORD:}
patrol.mqtt.keep-alive-seconds=10
patrol.mqtt.connect-timeout-seconds=5
patrol.mqtt.reconnect-interval-ms=${PATROL_MQTT_RECONNECT_MS:5000}
patrol.mqtt.publish-timeout-ms=1000
