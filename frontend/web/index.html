<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SCOUT MINI 远程巡检控制台">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#0F766E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SCOUT 巡检">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>SCOUT 远程巡检控制台</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1220; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 10px; color: #9FB3C8;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #boot .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #0F766E;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="boot"><span class="dot"></span><span>正在加载 SCOUT 控制台…</span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
