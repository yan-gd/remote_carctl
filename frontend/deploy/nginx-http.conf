# Bootstrap HTTP config for agilex.yoyoyan.cn (exp3 React console).
#
# Use this first to obtain a certificate with certbot webroot:
#   sudo certbot certonly --webroot -w /var/www/certbot -d agilex.yoyoyan.cn ...
# Then replace this file with nginx-tls.conf and reload nginx.
#
# Install as /etc/nginx/sites-available/agilex.yoyoyan.cn and symlink into
# /etc/nginx/sites-enabled/.

limit_req_zone $binary_remote_addr zone=agilex_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agilex_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name agilex.yoyoyan.cn;

    server_tokens off;
    root /var/www/agilex;
    index index.html;
    client_max_body_size 1m;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /api/v1/auth/login {
        limit_req zone=agilex_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=agilex_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
