# Add ONCE inside the existing HTTPS server for agilex.yoyoyan.cn.
# The browser's in-memory JWT is checked by the existing Spring Boot endpoint.
# Do not expose MediaMTX HTTP :8889 publicly or pass JWTs to MediaMTX.
location = /_scout_webrtc_auth {
    internal;
    proxy_pass http://127.0.0.1:8080/api/v1/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
}

location ^~ /webrtc/ {
    auth_request /_scout_webrtc_auth;
    proxy_pass http://127.0.0.1:8889/;
    proxy_redirect / /webrtc/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_store off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    access_log off;
    add_header Cache-Control "no-store" always;
}
