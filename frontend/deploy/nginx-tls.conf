# Production TLS config for agilex.yoyoyan.cn (exp3 React console).
#
# Install as /etc/nginx/sites-available/agilex.yoyoyan.cn after the certificate
# exists (see deploy/README.md), then:
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=agilex_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agilex_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name agilex.yoyoyan.cn;

    # Renewal must keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on older nginx too; on nginx >= 1.25.1 the
    # equivalent is `http2 on;` and this form only logs a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agilex.yoyoyan.cn;

    ssl_certificate /etc/letsencrypt/live/agilex.yoyoyan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agilex.yoyoyan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:agilex_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/agilex;
    index index.html;
    client_max_body_size 1m;

    include /etc/nginx/snippets/agilex-security-headers.conf;
    include /etc/nginx/snippets/agilex-camera-relay.conf;
    # After authenticated MediaMTX is installed:
    # include /etc/nginx/snippets/agilex-webrtc-relay.conf;

    # Production does not need Swagger. Uncomment the three blocks to expose it
    # temporarily (the API itself still requires a JWT).
    location ^~ /swagger-ui { return 404; }
    location = /swagger-ui.html { return 404; }
    location ^~ /v3/api-docs { return 404; }

    # Login: strict per-IP rate limit. A 429 is surfaced by the React client as
    # "请求过于频繁，请稍后再试".
    location = /api/v1/auth/login {
        limit_req zone=agilex_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/agilex-security-headers.conf;
    }

    location /api/ {
        limit_req zone=agilex_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # API responses can contain telemetry and tokens in headers; never cache.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/agilex-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/agilex-security-headers.conf;
        try_files $uri =404;
    }

    # Vite emits content-hashed files under /assets/; cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/agilex-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        include /etc/nginx/snippets/agilex-security-headers.conf;
        try_files $uri =404;
    }

    # React is a single-page app: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
