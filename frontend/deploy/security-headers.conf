# Shared security headers for agilex.yoyoyan.cn (exp3 React console).
#
# Copy to /etc/nginx/snippets/agilex-security-headers.conf.
# nginx does not inherit `add_header` into locations that define their own
# add_header, so locations with Cache-Control include this file again.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# React 19 + Vite 7 production build: one external JS bundle and one external
# CSS file, no inline script, no external fonts or CDN. Keep this policy strict;
# if you add inline <style> or a third-party script, update it deliberately.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
