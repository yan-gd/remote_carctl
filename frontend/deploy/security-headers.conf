# Shared security headers for agilex.yoyoyan.cn (exp3 Flutter console).
#
# Copy to /etc/nginx/snippets/agilex-security-headers.conf.
# nginx does not inherit `add_header` into locations that define their own
# add_header, so locations with Cache-Control include this file again.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# The release build was tested with this policy: Flutter uses WASM (wasm-unsafe-eval),
# blob workers for skwasm/canvaskit, and inline styles for the canvas.
# No external font/CDN origins are required: the CJK and Roboto fonts are bundled.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
