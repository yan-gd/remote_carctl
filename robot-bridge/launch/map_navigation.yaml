# Map navigation on the differential/skid-steer chassis; retain vendor costmaps.
# These speeds stay within the bridge's default 0.2 m/s, 0.4 rad/s limits.
base_global_planner: navfn/NavfnROS
base_local_planner: base_local_planner/TrajectoryPlannerROS
controller_frequency: 10.0
planner_frequency: 2.0
planner_patience: 4.0
controller_patience: 4.0
max_planning_retries: 3
recovery_behavior_enabled: false
clearing_rotation_allowed: false
oscillation_timeout: 30.0
oscillation_distance: 0.1
shutdown_costmaps: false

NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0

TrajectoryPlannerROS:
  odom_topic: /odom
  holonomic_robot: false
  dwa: true
  max_vel_x: 0.15
  min_vel_x: 0.0
  max_vel_theta: 0.3
  max_rotational_vel: 0.3
  min_vel_theta: -0.3
  min_in_place_vel_theta: 0.15
  escape_vel: 0.0
  acc_lim_x: 0.3
  acc_lim_y: 0.0
  acc_lim_theta: 0.6
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vtheta_samples: 20
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  latch_xy_goal_tolerance: false
  stop_time_buffer: 0.3
  meter_scoring: true
