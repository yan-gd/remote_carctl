# Short-range odom navigation. Never turn unknown space into assumed free space.
base_global_planner: navfn/NavfnROS
base_local_planner: base_local_planner/TrajectoryPlannerROS
controller_frequency: 10.0
planner_frequency: 2.0
planner_patience: 4.0
controller_patience: 4.0
max_planning_retries: 3
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false

NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0

global_costmap: &rolling_grid
  global_frame: odom
  robot_base_frame: base_link
  rolling_window: true
  static_map: false
  track_unknown_space: true
  update_frequency: 5.0
  publish_frequency: 2.0
  always_send_full_costmap: true
  transform_tolerance: 0.3
  width: 12.0
  height: 12.0
  resolution: 0.05
  footprint: [[-0.33, -0.33], [-0.33, 0.33], [0.33, 0.33], [0.33, -0.33]]
  footprint_padding: 0.02
  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  obstacles:
    enabled: true
    track_unknown_space: true
    footprint_clearing_enabled: true
    observation_sources: scan
    scan:
      topic: /scan
      data_type: LaserScan
      marking: true
      clearing: true
      obstacle_range: 5.0
      raytrace_range: 5.5
      observation_persistence: 0.0
      expected_update_rate: 0.3
      inf_is_valid: true
  inflation:
    enabled: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0

local_costmap:
  <<: *rolling_grid
  width: 6.0
  height: 6.0
  update_frequency: 10.0

TrajectoryPlannerROS:
  odom_topic: /odom
  holonomic_robot: false
  dwa: true
  max_vel_x: 0.15
  min_vel_x: 0.0
  max_vel_theta: 0.3
  max_rotational_vel: 0.3
  min_vel_theta: -0.3
  min_in_place_vel_theta: 0.15
  escape_vel: 0.0 # Disable the planner's fallback reverse maneuver.
  acc_lim_x: 0.3
  acc_lim_y: 0.0
  acc_lim_theta: 0.6
  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vtheta_samples: 20
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  latch_xy_goal_tolerance: false
  stop_time_buffer: 0.3
  meter_scoring: true
